
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像アップローダー登録画面</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">

    <!-- ヘッダー -->
    <div class="bg-indigo-600 px-6 py-5 text-white">
        <h1 class="text-xl font-bold tracking-wide">
            画像アップローダー登録
        </h1>
        <p class="text-xs text-indigo-200 mt-1">
            必要事項を入力し、顔認証を行ってください。
        </p>
    </div>

    <div class="p-6">

        <!-- 画面1：入力画面 -->
        <div id="step-input" class="space-y-6">

            <form id="registration-form" class="space-y-5">

                <!-- メールアドレス -->
                <div>
                    <label for="email"
                        class="block text-sm font-semibold text-slate-700 mb-1">
                        連絡用eメールアドレス
                        <span class="text-red-500">*</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        autocomplete="email"
                        placeholder="example@domain.com"
                        class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-slate-800 text-sm"
                    >
                </div>

                <!-- 顔写真 -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">
                        顔写真認証
                        <span class="text-red-500">*</span>
                    </label>

                    <div id="drop-area"
                        class="border-2 border-dashed border-slate-300 rounded-xl p-4 text-center hover:border-indigo-400 transition bg-slate-50">

                        <input
                            type="file"
                            id="face-image"
                            name="face-image"
                            accept="image/*"
                            required
                            class="hidden"
                        >

                        <label for="face-image"
                            class="cursor-pointer block">
                            <div class="text-slate-500 text-sm mb-2">
                                ここに画像をドラッグ＆ドロップ
                            </div>
                            <span class="text-xs text-indigo-600 font-medium bg-indigo-50 py-1.5 px-3 rounded-md inline-block">
                                ファイルを選択
                            </span>
                        </label>

                        <p id="file-name"
                            class="text-xs text-slate-600 mt-3 break-all">
                            ファイルが選択されていません
                        </p>

                        <img
                            id="image-preview"
                            alt="選択した顔写真のプレビュー"
                            class="hidden mt-4 mx-auto max-h-48 rounded-lg object-contain"
                        >
                    </div>

                    <p class="text-xs text-slate-500 mt-2 leading-relaxed">
                        ※ 顔写真は登録処理のために使用します。
                        実際の保存期間や削除方法は、運用環境に応じて設定してください。
                    </p>
                </div>

                <!-- エラーメッセージ -->
                <p id="error-message"
                    class="hidden text-sm text-red-600"
                    role="alert"></p>

                <!-- 登録ボタン -->
                <button
                    type="submit"
                    id="submit-btn"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-300 disabled:cursor-not-allowed text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-indigo-200 transition duration-200 text-sm">
                    登録する
                </button>

            </form>
        </div>

        <!-- 画面2：処理中 -->
        <div id="step-loading"
            class="hidden py-12 text-center space-y-4"
            role="status"
            aria-live="polite">

            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-indigo-600 border-t-transparent"></div>

            <p class="text-slate-800 font-semibold text-sm">
                登録処理を行っています...
            </p>

            <p class="text-slate-500 text-xs">
                そのまましばらくお待ちください。
            </p>
        </div>

        <!-- 画面3：登録完了 -->
        <div id="step-complete"
            class="hidden py-8 text-center space-y-5"
            role="status"
            aria-live="polite">

            <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-3xl font-bold">
                ✓
            </div>

            <div class="space-y-2">
                <h2 class="text-xl font-bold text-slate-800">
                    登録を受け付けました
                </h2>

                <p class="text-slate-600 text-sm leading-relaxed">
                    仮登録申請が完了しました。<br>
                    以下のリンクから本登録を行なってください。
                </p>
            </div>

            <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 text-left">
                <p class="text-xs text-slate-500 mb-1">
                    登録メールアドレス
                </p>
                <p id="registered-email"
                    class="text-sm font-medium text-slate-800 break-all">
                </p>
                <div class="border-t border-slate-200 my-3"></div>
                <p class="text-xs text-slate-500 mb-1">
                    受付状況
                </p>
                <p class="text-sm font-semibold text-yellow-600">
                    仮申請受付済み　本登録未完了
                </p>
            </div>

            <p class="text-xs text-slate-500 leading-relaxed">
                確認メールが届かない場合は、迷惑メールフォルダもご確認ください。
            </p>
　　　　　　　　<a href="https://forms.gle/a16cHw5T2TLbLRmw9" id="back-btn" class="inline-block text-center w-full border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold py-3 px-4 rounded-xl transition text-sm">
             本登録へ
             </a>


        </div>

    </div>
</div>

<script>
(() => {
    const form = document.getElementById('registration-form');
    const emailInput = document.getElementById('email');
    const fileInput = document.getElementById('face-image');
    const dropArea = document.getElementById('drop-area');
    const fileName = document.getElementById('file-name');
    const preview = document.getElementById('image-preview');
    const submitBtn = document.getElementById('submit-btn');
    const errorMessage = document.getElementById('error-message');

    const inputStep = document.getElementById('step-input');
    const loadingStep = document.getElementById('step-loading');
    const completeStep = document.getElementById('step-complete');

    const registeredEmail = document.getElementById('registered-email');
    const backBtn = document.getElementById('back-btn');

    let previewUrl = null;
    let processing = false;

    function showStep(step) {
        inputStep.classList.toggle('hidden', step !== 'input');
        loadingStep.classList.toggle('hidden', step !== 'loading');
        completeStep.classList.toggle('hidden', step !== 'complete');
    }

    function showError(message) {
        errorMessage.textContent = message;
        errorMessage.classList.remove('hidden');
    }

    function clearError() {
        errorMessage.textContent = '';
        errorMessage.classList.add('hidden');
    }

    function releasePreview() {
        if (previewUrl) {
            URL.revokeObjectURL(previewUrl);
            previewUrl = null;
        }
        preview.removeAttribute('src');
        preview.classList.add('hidden');
    }

    function setFile(file) {
        clearError();

        if (!file) return;

        if (!file.type.startsWith('image/')) {
            showError('画像ファイルを選択してください。');
            fileInput.value = '';
            fileName.textContent = 'ファイルが選択されていません';
            releasePreview();
            return;
        }

        // 画像サイズの上限：10MB
        if (file.size > 10 * 1024 * 1024) {
            showError('画像サイズは10MB以下にしてください。');
            fileInput.value = '';
            fileName.textContent = 'ファイルが選択されていません';
            releasePreview();
            return;
        }

        // ドロップで設定したファイルも input から参照できるようにする
        if (fileInput.files[0] !== file) {
            const transfer = new DataTransfer();
            transfer.items.add(file);
            fileInput.files = transfer.files;
        }

        releasePreview();
        fileName.textContent = file.name;
        previewUrl = URL.createObjectURL(file);
        preview.src = previewUrl;
        preview.classList.remove('hidden');
    }

    // ファイル選択
    fileInput.addEventListener('change', () => {
        if (fileInput.files.length > 0) {
            setFile(fileInput.files[0]);
        }
    });

    // ドラッグ＆ドロップ
    ['dragenter', 'dragover'].forEach(eventName => {
        dropArea.addEventListener(eventName, event => {
            event.preventDefault();
            dropArea.classList.add('border-indigo-500', 'bg-indigo-50');
        });
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropArea.addEventListener(eventName, event => {
            event.preventDefault();
            dropArea.classList.remove('border-indigo-500', 'bg-indigo-50');
        });
    });

    dropArea.addEventListener('drop', event => {
        const file = event.dataTransfer.files[0];
        if (file) setFile(file);
    });

    // 登録処理
    form.addEventListener('submit', async event => {
        event.preventDefault();

        if (processing) return;
        clearError();

        // 必須項目のチェック
        if (!form.reportValidity()) return;

        const email = emailInput.value.trim();
        const file = fileInput.files[0];

        if (!email || !file) {
            showError('メールアドレスと顔写真を入力してください。');
            return;
        }

        if (!file.type.startsWith('image/') ||
            file.size > 10 * 1024 * 1024) {
            showError('有効な画像ファイル（10MB以下）を選択してください。');
            return;
        }

        processing = true;
        submitBtn.disabled = true;
        showStep('loading');

        try {
            /*
             * デモ用の待機処理です。
             *
             * 実運用ではここでサーバーにメールアドレスと画像を送信し、
             * サーバーが登録を正常に受け付けた場合にのみ完了画面へ進みます。
             */
            await new Promise(resolve => setTimeout(resolve, 1500));

            registeredEmail.textContent = email;
            showStep('complete');

        } catch (error) {
            showStep('input');
            showError('登録処理に失敗しました。もう一度お試しください。');
        } finally {
            processing = false;
            submitBtn.disabled = false;
        }
    });

    // 入力画面に戻る
    backBtn.addEventListener('click', () => {
        showStep('input');
        clearError();
    });

    // ページ離脱時にプレビュー用URLを解放
    window.addEventListener('beforeunload', releasePreview);
})();
</script>

</body>
</html>
